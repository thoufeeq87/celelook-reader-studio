{% extends 'reviews/base.html' %}{% block title %}Log in · Celelook{% endblock %}{% block content %}
<div class="max-w-md mx-auto card p-8"><h1 class="font-serif text-3xl text-ink">Welcome back</h1><p class="text-stone-500 text-sm mt-2 mb-6">Your private memoir notebook is ready.</p><form method="post" class="space-y-4">{% csrf_token %}{% if form.errors %}<p class="text-red-700 text-sm">Please check your username and password.</p>{% endif %}<div class="field"><label for="id_username">Username</label><input class="w-full rounded-xl border border-stone-300 px-3 py-2" id="id_username" name="username" autocomplete="username" required></div><div class="field"><label for="id_password">Password</label><input class="w-full rounded-xl border border-stone-300 px-3 py-2" type="password" id="id_password" name="password" autocomplete="current-password" required></div><input type="hidden" name="next" value="{{ next }}"><button class="btn btn-primary w-full">Log in</button></form><p class="text-sm text-stone-500 mt-6">New here? <a href="{% url 'signup' %}" class="text-pine font-semibold">Create an account</a></p></div>
{% endblock %}
